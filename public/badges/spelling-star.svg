<title id="title">Dyslexor — Spelling Star</title>
<desc id="desc">Hand-drawn vector recreation of the Spelling Star achievement. A sculpted gold star surrounds faceted emerald enamel, an ivory check mark and a champagne diamond. Every visible element is vector geometry; no embedded bitmap is used.</desc>
